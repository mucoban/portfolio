<app-custom-cursor />

<app-header (goToSection)="onGoToSection($event)" />

<app-info />

<app-skills />

@if (1) {
  <!--<div #columnPage class="column-page" (scroll)="onScrollColumnPage($event)">-->

  <div class="section expreience" #section>
    <div class="container">
      <div class="inner">
        <div class="headline">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="currentColor"
            class="bi bi-briefcase-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v1.384l7.614 2.03a1.5 1.5 0 0 0 .772 0L16 5.884V4.5A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5"
            />
            <path
              d="M0 12.5A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5V6.85L8.129 8.947a.5.5 0 0 1-.258 0L0 6.85z"
            />
          </svg>
          Experience
        </div>
        @for (mitem of experience; track mitem) {
          <div class="sitem-wrapper">
            <div class="sitem">
              <div class="title1">{{ mitem.title1 }}</div>
              <div class="title2">{{ mitem.title2 }}</div>
              <div class="title3">{{ mitem.title3 }}</div>
              <div class="description" [innerHTML]="mitem.description"></div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="section side-works" #section>
    <div class="container">
      <div class="inner">
        <div class="headline">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="currentColor"
            class="bi bi-file-earmark-code"
            viewBox="0 0 16 16"
          >
            <path
              d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z"
            />
            <path
              d="M8.646 6.646a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1 0 .708l-2 2a.5.5 0 0 1-.708-.708L10.293 9 8.646 7.354a.5.5 0 0 1 0-.708m-1.292 0a.5.5 0 0 0-.708 0l-2 2a.5.5 0 0 0 0 .708l2 2a.5.5 0 0 0 .708-.708L5.707 9l1.647-1.646a.5.5 0 0 0 0-.708"
            />
          </svg>
          Side Works
        </div>
        @for (mitem of sideWorks; track mitem) {
          <div class="sitem-wrapper">
            <div class="sitem">
              <div class="title1">{{ mitem.title1 }}</div>
              <div class="title2">{{ mitem.title2 }}</div>
              <div class="description" [innerHTML]="mitem.description"></div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}

<!--</div>-->

<!--    <ng-container [ngTemplateOutlet]="sideButtons" />-->

<ng-template #sideButtons let-isMobile="isMobile">
  <div class="side-buttons" [ngClass]="{ mobile: isMobile }">
    <div class="inner">
      <button
        class="btn side-button"
        [ngClass]="{ disabled: activeMitem < 2 }"
        (click)="goToPrevNextSection()"
      >
        <img src="./assets/images/up4.svg" alt="up" />
      </button>
      <app-secion-texts [currentSt]="activeMitem" />
      <button
        class="btn side-button down"
        [ngClass]="{ disabled: activeMitem > 3 }"
        (click)="goToPrevNextSection(true)"
      >
        <img src="./assets/images/up4.svg" alt="up" />
      </button>
    </div>
  </div>
</ng-template>
